name: Screenshot PR

run-name: 'Screenshot PR #${{ inputs.pr_number }} · ${{ inputs.request_id || github.run_id }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR targeting develop'
        required: true
        type: string
      expected_head_sha:
        description: 'Expected PR head SHA (provide with expected_base_sha)'
        type: string
      expected_base_sha:
        description: 'Expected PR base SHA (provide with expected_head_sha)'
        type: string
      request_id:
        description: 'Optional unique request ID (letters, digits, dot, underscore, hyphen)'
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: screenshot-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve screenshot request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      base_sha: ${{ steps.context.outputs.base_sha }}
      merge_sha: ${{ steps.context.outputs.merge_sha }}
    steps:
      - name: Resolve PR and validate merge parents
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          REQUEST_ID: ${{ inputs.request_id || github.run_id }}
        run: |
          test "$DISPATCH_REF" = refs/heads/develop
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::PR number must be a positive integer and request ID must use 1-100 letters, digits, dots, underscores or hyphens."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          mkdir -p build/screenshot-context
          jq --arg request "$REQUEST_ID" --argjson run "$GITHUB_RUN_ID" '
            {pr_number: .number, head_sha: .head.sha, base_sha: .base.sha,
             merge_sha: .merge_commit_sha, request_id: $request, run_id: $run}
          ' "$RUNNER_TEMP/pr.json" > build/screenshot-context/context.json
          jq -e --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" '
            .state == "open" and .base.ref == "develop" and
            (.head.sha | test("^[a-f0-9]{40}$")) and (.base.sha | test("^[a-f0-9]{40}$")) and
            (($head == "" and $base == "") or (.head.sha == $head and .base.sha == $base)) and
            (.merge_commit_sha | type == "string" and test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/pr.json" > /dev/null || {
            echo "::error::PR must be open, target develop and match the expected SHAs, with a valid merge commit."
            exit 1
          }
          merge=$(jq -r .merge_commit_sha "$RUNNER_TEMP/pr.json")
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge" |
            jq -e --slurpfile pr "$RUNNER_TEMP/pr.json" '
              [.parents[].sha] == [$pr[0].base.sha, $pr[0].head.sha]
            ' > /dev/null
          jq -r '{pr_number, head_sha, base_sha, merge_sha} | to_entries[] | "\(.key)=\(.value)"' \
            build/screenshot-context/context.json >> "$GITHUB_OUTPUT"
      - name: Preserve request identity even on validation failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-context
          path: build/screenshot-context/context.json
          if-no-files-found: warn
          retention-days: 90

  compare:
    needs: prepare
    name: Compare / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            profile: pixel10-pro
            target: androidHostTest
            test-task: testAndroidHostTest
            task: compareRoborazziAndroidHostTest
            runner: ubuntu-24.04
          - platform: ios
            profile: iphone18-pro
            target: iosSimulatorArm64
            test-task: iosSimulatorArm64Test
            task: compareRoborazziIosSimulatorArm64
            runner: macos-26
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      PROFILE: ${{ matrix.profile }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      SOURCE_SHA: ${{ needs.prepare.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.merge_sha }}
          persist-credentials: false
      - name: Verify checked out PR merge commit
        env:
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Download Golden for exact PR base SHA
        shell: bash
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          deadline=$((SECONDS + 600))
          while true; do
            if ! golden=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/screenshot-golden.yml/runs?branch=develop&head_sha=$BASE_SHA&per_page=1" \
              --jq '.workflow_runs[0] // empty'); then
              echo "::error::Golden lookup failed for base SHA $BASE_SHA. See the GitHub CLI error above."
              exit 1
            fi
            if [[ -z "$golden" ]]; then
              echo "::error::No Golden run exists for base SHA $BASE_SHA."
              exit 1
            fi
            run_id=$(jq -r '.id' <<< "$golden")
            status=$(jq -r '.status' <<< "$golden")
            conclusion=$(jq -r '.conclusion // "none"' <<< "$golden")
            run_url=$(jq -r '.html_url' <<< "$golden")
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                echo "::error::Golden ended with $conclusion for base SHA $BASE_SHA. See $run_url"
                exit 1
              fi
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Golden did not complete within 10 minutes for base SHA $BASE_SHA. See $run_url"
              exit 1
            fi
            echo "Golden status: $status. Check again in 30 seconds. $run_url"
            sleep 30
          done
          printf '%s\n' "$golden" > "$RUNNER_TEMP/screenshot-golden-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$RUNNER_TEMP/screenshot-golden-artifacts.json"
          jq -e --arg sha "$BASE_SHA" '.head_sha == $sha and .head_branch == "develop" and .event == "push" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/screenshot-golden-run.json" > /dev/null
          jq -e --arg name "screenshot-golden-$PLATFORM" '[.artifacts[] | select(.name == $name)] | length == 1 and .[0].expired == false' "$RUNNER_TEMP/screenshot-golden-artifacts.json" > /dev/null
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "screenshot-golden-$PLATFORM" -D build/screenshot-baseline; then
            echo "::error::Golden artifact for base SHA $BASE_SHA is missing, expired, or unavailable. See $run_url"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Select Xcode 26.6
        if: matrix.platform == 'ios'
        id: xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          dependency_hash=$(sed -E '/^version-(code|name)[[:space:]]*=/d' gradle/libs.versions.toml | shasum -a 256 | cut -d ' ' -f 1)
          echo "dependency_hash=$dependency_hash" >> "$GITHUB_OUTPUT"
      - name: Cache Kotlin/Native
        if: matrix.platform == 'ios'
        id: konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-v2-${{ matrix.runner }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.dependency_hash }}
      - name: Validate v5 identity and restore exact-base Golden images
        shell: bash
        run: |
          export LC_ALL=C
          metadata=build/screenshot-baseline/metadata.json
          [[ -d build/screenshot-baseline && ! -L build/screenshot-baseline ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
          [[ -f "$metadata" && ! -L "$metadata" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
          test -z "$(find build/screenshot-baseline ! -type d ! -type f -print)"
          jq -e --arg sha "$BASE_SHA" --arg platform "$PLATFORM" --arg profile "$PROFILE" \
            --slurpfile current scripts/screenshot/scenarios.json '
          def valid_registry:
            def safe: type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*\\z") and
              (contains("__") | not) and (test("_(actual|compare|before)\\z") | not);
            type == "object" and length > 0 and all(to_entries[];
              (.key | safe) and (.value | type == "array" and length > 0 and all(.[]; safe))) and
            ([.[][]] | length == (unique | length));
            .schema_version == 5 and .source_sha == $sha and .platform == $platform and
            .languages == ["ko", "en"] and
            .profiles == {default: $profile, "small-large-font": ($profile + "-small-large-font"), narrow: ($profile + "-narrow")} and
            (.scenarios | valid_registry) and ($current[0] | valid_registry)
          ' "$metadata" > /dev/null || { echo "::error::Missing or incompatible exact-base Golden; schema v5 is required."; exit 1; }
          jq -r --arg profile "$PROFILE" '.scenarios |
          to_entries[] | .key as $module | .value[] as $id | ["ko", "en"][] as $language |
            $module + "/" + $id + "__" + $language + "__" + $profile +
            (if $id == "setting.notification.small.large-font" then "-small-large-font"
               elif (["library.preview.narrow", "library.preview.english.narrow", "library.preview.english.error"] | index($id)) != null then "-narrow"
               else "" end) + ".png"
          ' "$metadata" | sort > "$RUNNER_TEMP/screenshot-base-files"
          jq -r --arg profile "$PROFILE" '
          to_entries[] | .key as $module | .value[] as $id | ["ko", "en"][] as $language |
            $module + "/" + $id + "__" + $language + "__" + $profile +
            (if $id == "setting.notification.small.large-font" then "-small-large-font"
               elif (["library.preview.narrow", "library.preview.english.narrow", "library.preview.english.error"] | index($id)) != null then "-narrow"
               else "" end) + ".png"
          ' scripts/screenshot/scenarios.json | sort > "$RUNNER_TEMP/screenshot-current-files"
          diff -u <({ echo metadata.json; cat "$RUNNER_TEMP/screenshot-base-files"; } | sort) \
            <(find build/screenshot-baseline -type f | sed 's|^build/screenshot-baseline/||' | sort)
          while IFS= read -r image; do
            [[ -f "build/screenshot-baseline/$image" && -s "build/screenshot-baseline/$image" && ! -L "build/screenshot-baseline/$image" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
            module=${image%%/*}
            if [[ ! -f "feature/$module/build.gradle.kts" ]]; then continue; fi
            destination="feature/$module/build/outputs/roborazzi/$TARGET"
            mkdir -p "$destination"
            cp "build/screenshot-baseline/$image" "$destination/"
          done < "$RUNNER_TEMP/screenshot-base-files"
      - name: Configure offline screenshot fixtures
        run: |
          cat > local.properties <<'EOF'
          CARO_DEV_SERVER=https://example.invalid/
          CARO_QA_SERVER=https://example.invalid/
          CARO_PROD_SERVER=https://example.invalid/
          GOOGLE_WEB_CLIENT_ID=screenshot-test
          EOF
      - name: Compare with Roborazzi (report only)
        shell: bash
        run: |
          test_tasks=()
          while IFS= read -r module; do
            test_tasks+=(":feature:$module:${{ matrix.test-task }}" --rerun)
          done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
          ./gradlew '${{ matrix.task }}' "${test_tasks[@]}" --stacktrace --profile --console=plain
      - name: Validate multilingual results and collect changed originals
        shell: bash
        run: |
          export LC_ALL=C
          [[ ! -e build/screenshot-report && ! -L build/screenshot-report ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
          [[ ! -e build/screenshot-before-after && ! -L build/screenshot-before-after ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
          mkdir -p build/screenshot-report build/screenshot-before-after
          : > "$RUNNER_TEMP/screenshot-results.jsonl"
          while IFS= read -r module; do
            capture_source="feature/$module/build/outputs/roborazzi/$TARGET"
            results="feature/$module/build/test-results/roborazzi/$TARGET/results-summary.json"
            [[ -d "$capture_source" && ! -L "$capture_source" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
            [[ -f "$results" && ! -L "$results" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
            test -z "$(find "$capture_source" ! -type d ! -type f -print)"
            jq -Rr --arg module "$module" 'select(startswith($module + "/")) | ltrimstr($module + "/")' \
              "$RUNNER_TEMP/screenshot-current-files" > "$RUNNER_TEMP/screenshot-module-files"
            jq -e --rawfile expected "$RUNNER_TEMP/screenshot-module-files" '
              (.results | type == "array") and
              ([.results[].golden_file_path | split("/")[-1]] | sort) == ($expected | split("\n") | map(select(length > 0)) | sort) and
              all(.results[]; .type == "changed" or .type == "added" or .type == "unchanged")
            ' "$results" > /dev/null
            jq -Rr --arg module "$module" 'select(startswith($module + "/")) | ltrimstr($module + "/")' \
              "$RUNNER_TEMP/screenshot-base-files" > "$RUNNER_TEMP/screenshot-allowed-files"
            while IFS=$'\t' read -r image kind; do
              key="$module/$image"
              if grep -Fxq -- "$key" "$RUNNER_TEMP/screenshot-base-files"; then test "$kind" != added
              else test "$kind" = added; fi
              stem=${image%.png}
              if [[ "$kind" == unchanged ]]; then
                [[ -f "$capture_source/$image" && -s "$capture_source/$image" && ! -L "$capture_source/$image" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
                continue
              fi
              printf '%s\n' "${stem}_actual.png" "${stem}_compare.png" >> "$RUNNER_TEMP/screenshot-allowed-files"
              actual="$capture_source/${stem}_actual.png"
              [[ -f "$actual" && -s "$actual" && ! -L "$actual" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
              mkdir -p "build/screenshot-before-after/$module" "build/screenshot-report/$module"
              cp "$actual" "build/screenshot-before-after/$module/"
              if [[ "$kind" == changed ]]; then
                cp "build/screenshot-baseline/$key" "build/screenshot-before-after/$module/${stem}_before.png"
                diagnostic="${stem}_compare.png"
              else diagnostic="${stem}_actual.png"; fi
              [[ -f "$capture_source/$diagnostic" && -s "$capture_source/$diagnostic" && ! -L "$capture_source/$diagnostic" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
              cp "$capture_source/$diagnostic" "build/screenshot-report/$module/"
            done < <(jq -r '.results[] | [(.golden_file_path | split("/")[-1]), .type] | @tsv' "$results")
            sort -u "$RUNNER_TEMP/screenshot-allowed-files" > "$RUNNER_TEMP/screenshot-allowed-sorted"
            find "$capture_source" -type f | sed "s|^$capture_source/||" | sort > "$RUNNER_TEMP/screenshot-actual-files"
            test -z "$(comm -23 "$RUNNER_TEMP/screenshot-actual-files" "$RUNNER_TEMP/screenshot-allowed-sorted")"
            while IFS= read -r image; do test -s "$capture_source/$image"; done < "$RUNNER_TEMP/screenshot-actual-files"
            jq -c --arg module "$module" '.results[] |
              {key: ($module + "/" + (.golden_file_path | split("/")[-1] | rtrimstr(".png"))), type}' \
              "$results" >> "$RUNNER_TEMP/screenshot-results.jsonl"
          done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
          comm -23 "$RUNNER_TEMP/screenshot-base-files" "$RUNNER_TEMP/screenshot-current-files" | \
            jq -Rsc 'split("\n") | map(select(length > 0) | rtrimstr(".png"))' > "$RUNNER_TEMP/screenshot-removed.json"
          jq -s --arg platform "$PLATFORM" --arg profile "$PROFILE" --argjson number "$PR_NUMBER" \
            --arg base "$BASE_SHA" --arg head "$HEAD_SHA" --arg source "$SOURCE_SHA" \
            --slurpfile current scripts/screenshot/scenarios.json --slurpfile baseline build/screenshot-baseline/metadata.json \
            --slurpfile removed "$RUNNER_TEMP/screenshot-removed.json" '
            {schema_version: 5, platform: $platform, pr_number: $number, base_sha: $base, head_sha: $head, source_sha: $source,
             languages: ["ko", "en"], profiles: {default: $profile, "small-large-font": ($profile + "-small-large-font"), narrow: ($profile + "-narrow")},
             scenarios: $current[0], baseline_scenarios: $baseline[0].scenarios, total: length,
             changed: [.[] | select(.type == "changed") | .key], added: [.[] | select(.type == "added") | .key], removed: $removed[0]}
          ' "$RUNNER_TEMP/screenshot-results.jsonl" > build/screenshot-report/summary.json
          cp build/screenshot-report/summary.json build/screenshot-before-after/summary.json
      - uses: actions/upload-artifact@v6
        with:
          name: screenshot-report-${{ matrix.platform }}
          path: build/screenshot-report/
          if-no-files-found: error
          retention-days: 90
      - name: Upload Before/After originals
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-before-after-${{ matrix.platform }}
          path: build/screenshot-before-after/
          if-no-files-found: error
          retention-days: 90
      - name: Upload Roborazzi diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-diagnostics-${{ matrix.platform }}
          path: |
            feature/*/build/test-results/roborazzi/${{ matrix.target }}/
            feature/*/build/reports/roborazzi/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-profile-${{ matrix.platform }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14
