name: iOS Worker Benchmark 185
run-name: 'iOS worker benchmark #185 · fixed cache · ${{ github.sha }}'
'on':
  push:
    branches:
    - build/185-ios-worker-benchmark
    paths:
    - .github/workflows/ios-worker-benchmark.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: 36397502b3086acb10883c0c2c2fdbe817c5894f
  GOLDEN_RUN: '38759977731'
defaults:
  run:
    shell: bash
jobs:
  prepare:
    name: Prepare frozen warm cache
    runs-on: macos-26
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 36397502b3086acb10883c0c2c2fdbe817c5894f
        persist-credentials: false
    - name: Download pinned Golden
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GOLDEN_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GOLDEN_RUN" --jq '.conclusion')" = success
        gh run download "$GOLDEN_RUN" --repo "$GITHUB_REPOSITORY" -n screenshot-golden-ios -D build/screenshot-baseline
        cmp scripts/screenshot/scenarios.json build/screenshot-baseline/scenarios.json
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v4
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true
        cache-cleanup: never
    - name: Select Xcode 26.6
      id: xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode_26.6.app
        echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        dependency_hash=$(sed -E '/^version-(code|name)[[:space:]]*=/d' gradle/libs.versions.toml | shasum -a 256 | cut -d ' ' -f 1)
        echo "dependency_hash=$dependency_hash" >> "$GITHUB_OUTPUT"
    - name: Restore production Kotlin Native cache
      id: konan
      uses: actions/cache/restore@v4
      with:
        path: ~/.konan
        key: konan-v2-macos-26-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.dependency_hash }}
    - name: Validate scenarios and restore Golden images
      shell: bash
      env:
        TARGET: iosSimulatorArm64
      run: |
        for manifest in build/screenshot-baseline/scenarios.json scripts/screenshot/scenarios.json; do
          jq -e 'type == "object" and length > 0 and all(to_entries[];
            (.key | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.value | type == "array" and length > 0 and length == (unique | length) and
              all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and
                (test("_(actual|compare)$") | not))))' "$manifest" > /dev/null
        done
        test -z "$(find build/screenshot-baseline -type l -print)"
        diff -u <(jq -r 'to_entries[] | .key as $module | .value[] | $module + "/" + . + ".png"' build/screenshot-baseline/scenarios.json | sort) \
          <(find build/screenshot-baseline -type f -name '*.png' | sed 's|^build/screenshot-baseline/||' | sort)
        while IFS=$'\t' read -r module scenario; do
          destination="feature/$module/build/outputs/roborazzi/$TARGET"
          mkdir -p "$destination"
          cp "build/screenshot-baseline/$module/$scenario.png" "$destination/"
        done < <(jq -r 'to_entries[] | .key as $module | .value[] | [$module, .] | @tsv' build/screenshot-baseline/scenarios.json)
    - name: Configure offline screenshot fixtures
      run: |
        cat > local.properties <<'EOF'
        CARO_DEV_SERVER=https://example.invalid/
        CARO_QA_SERVER=https://example.invalid/
        CARO_PROD_SERVER=https://example.invalid/
        GOOGLE_WEB_CLIENT_ID=screenshot-test
        EOF
    - name: Warm up all rendering tasks
      run: |-
        test_tasks=()
        while IFS= read -r module; do
          test_tasks+=(":feature:$module:iosSimulatorArm64Test" --rerun)
        done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
        ./gradlew compareRoborazziIosSimulatorArm64 "${test_tasks[@]}" --stacktrace --profile --console=plain
        ./gradlew --stop
    - name: Validate all 14 fresh screenshot results
      shell: bash
      env:
        TARGET: iosSimulatorArm64
        PLATFORM: ios
        PR_NUMBER: '0'
        BASE_SHA: 36397502b3086acb10883c0c2c2fdbe817c5894f
        HEAD_SHA: 36397502b3086acb10883c0c2c2fdbe817c5894f
      run: |
        # Keep the legacy artifact compatible with the default-branch publisher until merge.
        mkdir -p build/screenshot-report build/screenshot-before-after
        : > build/screenshot-results.jsonl
        while IFS= read -r module; do
          source="feature/$module/build/outputs/roborazzi/$TARGET"
          results="feature/$module/build/test-results/roborazzi/$TARGET/results-summary.json"
          ids=$(jq -c --arg module "$module" '.[$module]' scripts/screenshot/scenarios.json)
          jq -e --argjson ids "$ids" '
            (.results | type == "array") and
            ([.results[].golden_file_path | split("/")[-1]] | sort) == ($ids | map(. + ".png") | sort) and
            all(.results[]; .type == "changed" or .type == "added" or .type == "unchanged")' "$results" > /dev/null
          while IFS=$'\t' read -r scenario kind; do
            if jq -e --arg module "$module" --arg scenario "$scenario" '(.[$module] // []) | index($scenario) != null' \
              build/screenshot-baseline/scenarios.json > /dev/null; then
              test "$kind" != added
            else
              test "$kind" = added
            fi
            case "$kind" in
              changed) image="${scenario}_compare.png" ;;
              added) image="${scenario}_actual.png" ;;
              unchanged) continue ;;
            esac
            test -f "$source/$image" && test ! -L "$source/$image"
            mkdir -p "build/screenshot-report/$module"
            cp "$source/$image" "build/screenshot-report/$module/"
            mkdir -p "build/screenshot-before-after/$module"
            actual="$source/${scenario}_actual.png"
            test -f "$actual" && test ! -L "$actual"
            cp "$actual" "build/screenshot-before-after/$module/"
            if [[ "$kind" == changed ]]; then
              before="build/screenshot-baseline/$module/$scenario.png"
              test -f "$before" && test ! -L "$before"
              cp "$before" "build/screenshot-before-after/$module/${scenario}_before.png"
            fi
          done < <(jq -r '.results[] | [(.golden_file_path | split("/")[-1] | rtrimstr(".png")), .type] | @tsv' "$results")
          jq -c --arg module "$module" '.results[] | {scenario: ($module + "/" + (.golden_file_path | split("/")[-1] | rtrimstr(".png"))), type}' \
            "$results" >> build/screenshot-results.jsonl
        done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
        removed=$(jq -n --slurpfile golden build/screenshot-baseline/scenarios.json --slurpfile current scripts/screenshot/scenarios.json '
          def scenarios: to_entries[] | .key as $module | .value[] | $module + "/" + .;
          [$golden[0] | scenarios] - [$current[0] | scenarios]')
        jq -s --arg platform "$PLATFORM" --argjson pr_number "$PR_NUMBER" --arg base_sha "$BASE_SHA" --arg head_sha "$HEAD_SHA" --argjson removed "$removed" '
          {platform: $platform, pr_number: $pr_number, base_sha: $base_sha, head_sha: $head_sha, total: length,
           changed: [.[] | select(.type == "changed") | .scenario],
           added: [.[] | select(.type == "added") | .scenario], removed: $removed}' \
          build/screenshot-results.jsonl > build/screenshot-report/summary.json
        cat build/screenshot-report/summary.json
        cp build/screenshot-report/summary.json build/screenshot-before-after/summary.json
    - name: Fingerprint frozen cache
      run: |-
        python3 - <<'PYTHON'
        import hashlib, json, os, platform, subprocess
        from pathlib import Path
        roots=[Path.home()/'.gradle/caches',Path.home()/'.gradle/wrapper',Path.home()/'.konan']
        hash_all=hashlib.sha256(); count=0; size=0
        for root in roots:
            for path in sorted(root.rglob('*')):
                if path.is_file() and not path.is_symlink():
                    file_hash=hashlib.sha256()
                    with path.open('rb') as stream:
                        for chunk in iter(lambda: stream.read(1024*1024), b''): file_hash.update(chunk)
                    digest=file_hash.hexdigest()
                    label=str(path.relative_to(Path.home()))
                    hash_all.update((label+'\0'+digest+'\n').encode())
                    count+=1; size+=path.stat().st_size
        identity={'sha256':hash_all.hexdigest(),'files':count,'bytes':size,
         'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion'),
         'arch':platform.machine(),'os':subprocess.check_output(['sw_vers','-productVersion'],text=True).strip(),
         'cpu':subprocess.check_output(['sysctl','-n','hw.ncpu'],text=True).strip(),
         'memory':subprocess.check_output(['sysctl','-n','hw.memsize'],text=True).strip(),
         'xcode':subprocess.check_output(['xcodebuild','-version'],text=True).strip(),
         'sdk':subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-version'],text=True).strip()}
        folder=Path.home()/'caro-worker-cache'; folder.mkdir(exist_ok=True)
        expected=folder/'identity.json'
        if os.environ.get('BENCHMARK_PHASE')=='measure':
            seed=json.loads(expected.read_text())
            assert identity==seed, {'expected':seed,'actual':identity}
        else:
            expected.write_text(json.dumps(identity,indent=2)+'\n')
        print(json.dumps(identity,indent=2))
        PYTHON
    - name: Save immutable benchmark cache
      uses: actions/cache/save@v4
      with:
        path: |-
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.konan
          ~/caro-worker-cache
        key: caro-worker-185-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/upload-artifact@v6
      with:
        name: worker-cache-identity
        path: ~/caro-worker-cache/identity.json
        if-no-files-found: error
        retention-days: 90
  measure:
    needs: prepare
    name: Worker ${{ matrix.workers }} / sample ${{ matrix.sample }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
        - workers: default
          sample: 1
        - workers: '1'
          sample: 1
        - workers: '2'
          sample: 1
        - workers: '1'
          sample: 2
        - workers: '2'
          sample: 2
        - workers: default
          sample: 2
        - workers: '2'
          sample: 3
        - workers: default
          sample: 3
        - workers: '1'
          sample: 3
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 36397502b3086acb10883c0c2c2fdbe817c5894f
        persist-credentials: false
    - name: Download pinned Golden
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GOLDEN_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GOLDEN_RUN" --jq '.conclusion')" = success
        gh run download "$GOLDEN_RUN" --repo "$GITHUB_REPOSITORY" -n screenshot-golden-ios -D build/screenshot-baseline
        cmp scripts/screenshot/scenarios.json build/screenshot-baseline/scenarios.json
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v4
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-disabled: true
    - name: Select Xcode 26.6
      id: xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode_26.6.app
        echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        dependency_hash=$(sed -E '/^version-(code|name)[[:space:]]*=/d' gradle/libs.versions.toml | shasum -a 256 | cut -d ' ' -f 1)
        echo "dependency_hash=$dependency_hash" >> "$GITHUB_OUTPUT"
    - name: Restore immutable benchmark cache
      id: frozen
      uses: actions/cache/restore@v4
      with:
        path: |-
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.konan
          ~/caro-worker-cache
        key: caro-worker-185-${{ github.run_id }}-${{ github.run_attempt }}
        fail-on-cache-miss: true
    - name: Verify exact cache and runner identity
      env:
        BENCHMARK_PHASE: measure
      run: |-
        python3 - <<'PYTHON'
        import hashlib, json, os, platform, subprocess
        from pathlib import Path
        roots=[Path.home()/'.gradle/caches',Path.home()/'.gradle/wrapper',Path.home()/'.konan']
        hash_all=hashlib.sha256(); count=0; size=0
        for root in roots:
            for path in sorted(root.rglob('*')):
                if path.is_file() and not path.is_symlink():
                    file_hash=hashlib.sha256()
                    with path.open('rb') as stream:
                        for chunk in iter(lambda: stream.read(1024*1024), b''): file_hash.update(chunk)
                    digest=file_hash.hexdigest()
                    label=str(path.relative_to(Path.home()))
                    hash_all.update((label+'\0'+digest+'\n').encode())
                    count+=1; size+=path.stat().st_size
        identity={'sha256':hash_all.hexdigest(),'files':count,'bytes':size,
         'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion'),
         'arch':platform.machine(),'os':subprocess.check_output(['sw_vers','-productVersion'],text=True).strip(),
         'cpu':subprocess.check_output(['sysctl','-n','hw.ncpu'],text=True).strip(),
         'memory':subprocess.check_output(['sysctl','-n','hw.memsize'],text=True).strip(),
         'xcode':subprocess.check_output(['xcodebuild','-version'],text=True).strip(),
         'sdk':subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-version'],text=True).strip()}
        folder=Path.home()/'caro-worker-cache'; folder.mkdir(exist_ok=True)
        expected=folder/'identity.json'
        if os.environ.get('BENCHMARK_PHASE')=='measure':
            seed=json.loads(expected.read_text())
            assert identity==seed, {'expected':seed,'actual':identity}
        else:
            expected.write_text(json.dumps(identity,indent=2)+'\n')
        print(json.dumps(identity,indent=2))
        PYTHON
    - name: Validate scenarios and restore Golden images
      shell: bash
      env:
        TARGET: iosSimulatorArm64
      run: |
        for manifest in build/screenshot-baseline/scenarios.json scripts/screenshot/scenarios.json; do
          jq -e 'type == "object" and length > 0 and all(to_entries[];
            (.key | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.value | type == "array" and length > 0 and length == (unique | length) and
              all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and
                (test("_(actual|compare)$") | not))))' "$manifest" > /dev/null
        done
        test -z "$(find build/screenshot-baseline -type l -print)"
        diff -u <(jq -r 'to_entries[] | .key as $module | .value[] | $module + "/" + . + ".png"' build/screenshot-baseline/scenarios.json | sort) \
          <(find build/screenshot-baseline -type f -name '*.png' | sed 's|^build/screenshot-baseline/||' | sort)
        while IFS=$'\t' read -r module scenario; do
          destination="feature/$module/build/outputs/roborazzi/$TARGET"
          mkdir -p "$destination"
          cp "build/screenshot-baseline/$module/$scenario.png" "$destination/"
        done < <(jq -r 'to_entries[] | .key as $module | .value[] | [$module, .] | @tsv' build/screenshot-baseline/scenarios.json)
    - name: Configure offline screenshot fixtures
      run: |
        cat > local.properties <<'EOF'
        CARO_DEV_SERVER=https://example.invalid/
        CARO_QA_SERVER=https://example.invalid/
        CARO_PROD_SERVER=https://example.invalid/
        GOOGLE_WEB_CLIENT_ID=screenshot-test
        EOF
    - name: Measure real screenshot comparison
      env:
        WORKERS: ${{ matrix.workers }}
        SAMPLE: ${{ matrix.sample }}
        CACHE_KEY: ${{ steps.frozen.outputs.cache-matched-key }}
      run: |-
        mkdir -p build/worker-benchmark
        cat > "$RUNNER_TEMP/worker-benchmark.init.gradle" <<'INIT'
        gradle.settingsEvaluated {
            println("BENCHMARK_WORKERS_MAX=" + gradle.startParameter.maxWorkerCount)
        }
        INIT
        cat > "$RUNNER_TEMP/worker-benchmark.py" <<'PYTHON'
        import json, os, subprocess, time
        from pathlib import Path
        scenarios=json.loads(Path('scripts/screenshot/scenarios.json').read_text())
        command=['./gradlew','compareRoborazziIosSimulatorArm64']
        for module in sorted(scenarios):
            command += [f':feature:{module}:iosSimulatorArm64Test','--rerun']
        command += ['--stacktrace','--profile','--console=plain','--init-script',os.environ['RUNNER_TEMP']+'/worker-benchmark.init.gradle']
        if os.environ['WORKERS']!='default': command += ['--max-workers='+os.environ['WORKERS']]
        started=time.time()
        # time reports the Gradle client's maximum RSS, not aggregate build-tree memory.
        with Path('build/worker-benchmark/time.txt').open('w') as resource:
            process=subprocess.Popen(['/usr/bin/time','-l']+command,stdout=subprocess.PIPE,stderr=resource,text=True)
            with Path('build/worker-benchmark/gradle.log').open('w') as log:
                for line in process.stdout:
                    print(line,end='',flush=True); log.write(line)
            result=process.wait()
        record={'workers':os.environ['WORKERS'],'sample':int(os.environ['SAMPLE']),
         'source_sha':os.environ['SOURCE_SHA'],'workflow_sha':os.environ['GITHUB_SHA'],
         'golden_run':os.environ['GOLDEN_RUN'],'cache_key':os.environ['CACHE_KEY'],
         'started_epoch':started,'finished_epoch':time.time(),'exit_code':result,'command':command}
        record['elapsed_seconds']=record['finished_epoch']-started
        Path('build/worker-benchmark/measurement.json').write_text(json.dumps(record,indent=2)+'\n')
        print(Path('build/worker-benchmark/time.txt').read_text())
        raise SystemExit(result)
        PYTHON
        python3 "$RUNNER_TEMP/worker-benchmark.py"
    - name: Validate all 14 fresh screenshot results
      shell: bash
      env:
        TARGET: iosSimulatorArm64
        PLATFORM: ios
        PR_NUMBER: '0'
        BASE_SHA: 36397502b3086acb10883c0c2c2fdbe817c5894f
        HEAD_SHA: 36397502b3086acb10883c0c2c2fdbe817c5894f
      run: |
        # Keep the legacy artifact compatible with the default-branch publisher until merge.
        mkdir -p build/screenshot-report build/screenshot-before-after
        : > build/screenshot-results.jsonl
        while IFS= read -r module; do
          source="feature/$module/build/outputs/roborazzi/$TARGET"
          results="feature/$module/build/test-results/roborazzi/$TARGET/results-summary.json"
          ids=$(jq -c --arg module "$module" '.[$module]' scripts/screenshot/scenarios.json)
          jq -e --argjson ids "$ids" '
            (.results | type == "array") and
            ([.results[].golden_file_path | split("/")[-1]] | sort) == ($ids | map(. + ".png") | sort) and
            all(.results[]; .type == "changed" or .type == "added" or .type == "unchanged")' "$results" > /dev/null
          while IFS=$'\t' read -r scenario kind; do
            if jq -e --arg module "$module" --arg scenario "$scenario" '(.[$module] // []) | index($scenario) != null' \
              build/screenshot-baseline/scenarios.json > /dev/null; then
              test "$kind" != added
            else
              test "$kind" = added
            fi
            case "$kind" in
              changed) image="${scenario}_compare.png" ;;
              added) image="${scenario}_actual.png" ;;
              unchanged) continue ;;
            esac
            test -f "$source/$image" && test ! -L "$source/$image"
            mkdir -p "build/screenshot-report/$module"
            cp "$source/$image" "build/screenshot-report/$module/"
            mkdir -p "build/screenshot-before-after/$module"
            actual="$source/${scenario}_actual.png"
            test -f "$actual" && test ! -L "$actual"
            cp "$actual" "build/screenshot-before-after/$module/"
            if [[ "$kind" == changed ]]; then
              before="build/screenshot-baseline/$module/$scenario.png"
              test -f "$before" && test ! -L "$before"
              cp "$before" "build/screenshot-before-after/$module/${scenario}_before.png"
            fi
          done < <(jq -r '.results[] | [(.golden_file_path | split("/")[-1] | rtrimstr(".png")), .type] | @tsv' "$results")
          jq -c --arg module "$module" '.results[] | {scenario: ($module + "/" + (.golden_file_path | split("/")[-1] | rtrimstr(".png"))), type}' \
            "$results" >> build/screenshot-results.jsonl
        done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
        removed=$(jq -n --slurpfile golden build/screenshot-baseline/scenarios.json --slurpfile current scripts/screenshot/scenarios.json '
          def scenarios: to_entries[] | .key as $module | .value[] | $module + "/" + .;
          [$golden[0] | scenarios] - [$current[0] | scenarios]')
        jq -s --arg platform "$PLATFORM" --argjson pr_number "$PR_NUMBER" --arg base_sha "$BASE_SHA" --arg head_sha "$HEAD_SHA" --argjson removed "$removed" '
          {platform: $platform, pr_number: $pr_number, base_sha: $base_sha, head_sha: $head_sha, total: length,
           changed: [.[] | select(.type == "changed") | .scenario],
           added: [.[] | select(.type == "added") | .scenario], removed: $removed}' \
          build/screenshot-results.jsonl > build/screenshot-report/summary.json
        cat build/screenshot-report/summary.json
        cp build/screenshot-report/summary.json build/screenshot-before-after/summary.json
    - name: Verify real rendering tasks executed
      run: |-
        while IFS= read -r module; do
          grep -Fx "> Task :feature:$module:iosSimulatorArm64Test" build/worker-benchmark/gradle.log
        done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
        cp "$HOME/caro-worker-cache/identity.json" build/worker-benchmark/cache-identity.json
        cat build/screenshot-report/summary.json >> "$GITHUB_STEP_SUMMARY"
    - name: Upload measurement and profiles
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: worker-${{ matrix.workers }}-sample-${{ matrix.sample }}
        path: |-
          build/worker-benchmark/
          build/reports/profile/
          build/screenshot-report/
          feature/*/build/test-results/roborazzi/iosSimulatorArm64/
          feature/*/build/reports/roborazzi/iosSimulatorArm64/
        if-no-files-found: error
        retention-days: 90
