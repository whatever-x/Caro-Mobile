name: iOS Worker Benchmark 185
run-name: 'iOS worker benchmark #185 · same runner · ${{ github.sha }}'
'on':
  push:
    branches:
    - build/185-ios-worker-benchmark
    paths:
    - .github/workflows/ios-worker-benchmark.yml
    - .github/scripts/ios-worker-benchmark.py
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: 36397502b3086acb10883c0c2c2fdbe817c5894f
  GOLDEN_RUN: '38759977731'
  FROZEN_CACHE_KEY: caro-worker-185-38850133315-1
defaults:
  run:
    shell: bash
jobs:
  measure:
    name: Nine samples on one runner
    runs-on: macos-26
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 36397502b3086acb10883c0c2c2fdbe817c5894f
        persist-credentials: false
    - name: Download pinned Golden
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GOLDEN_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GOLDEN_RUN" --jq '.conclusion')" = success
        gh run download "$GOLDEN_RUN" --repo "$GITHUB_REPOSITORY" -n screenshot-golden-ios -D build/screenshot-baseline
        cmp scripts/screenshot/scenarios.json build/screenshot-baseline/scenarios.json
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v4
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-disabled: true
    - name: Select Xcode 26.6
      id: xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode_26.6.app
        echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        dependency_hash=$(sed -E '/^version-(code|name)[[:space:]]*=/d' gradle/libs.versions.toml | shasum -a 256 | cut -d ' ' -f 1)
        echo "dependency_hash=$dependency_hash" >> "$GITHUB_OUTPUT"
    - name: Restore immutable benchmark cache
      id: frozen
      uses: actions/cache/restore@v4
      with:
        path: |-
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.konan
          ~/caro-worker-cache
        key: ${{ env.FROZEN_CACHE_KEY }}
        fail-on-cache-miss: true
    - name: Prepare snapshot on this runner
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/ios-worker-benchmark.py?ref=$GITHUB_SHA" \
          --jq .content | base64 --decode > "$RUNNER_TEMP/ios-worker-benchmark.py"
        python3 "$RUNNER_TEMP/ios-worker-benchmark.py" prepare
    - name: Measure worker default / sample 1
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample default 1
    - name: Upload worker default / sample 1
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-default-sample-1
        path: ${{ runner.temp }}/caro-worker-sequential/worker-default-sample-1/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker 1 / sample 1
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample 1 1
    - name: Upload worker 1 / sample 1
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-1-sample-1
        path: ${{ runner.temp }}/caro-worker-sequential/worker-1-sample-1/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker 2 / sample 1
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample 2 1
    - name: Upload worker 2 / sample 1
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-2-sample-1
        path: ${{ runner.temp }}/caro-worker-sequential/worker-2-sample-1/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker 1 / sample 2
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample 1 2
    - name: Upload worker 1 / sample 2
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-1-sample-2
        path: ${{ runner.temp }}/caro-worker-sequential/worker-1-sample-2/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker 2 / sample 2
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample 2 2
    - name: Upload worker 2 / sample 2
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-2-sample-2
        path: ${{ runner.temp }}/caro-worker-sequential/worker-2-sample-2/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker default / sample 2
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample default 2
    - name: Upload worker default / sample 2
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-default-sample-2
        path: ${{ runner.temp }}/caro-worker-sequential/worker-default-sample-2/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker 2 / sample 3
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample 2 3
    - name: Upload worker 2 / sample 3
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-2-sample-3
        path: ${{ runner.temp }}/caro-worker-sequential/worker-2-sample-3/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker default / sample 3
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample default 3
    - name: Upload worker default / sample 3
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-default-sample-3
        path: ${{ runner.temp }}/caro-worker-sequential/worker-default-sample-3/
        if-no-files-found: warn
        retention-days: 90
    - name: Measure worker 1 / sample 3
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" sample 1 3
    - name: Upload worker 1 / sample 3
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-1-sample-3
        path: ${{ runner.temp }}/caro-worker-sequential/worker-1-sample-3/
        if-no-files-found: warn
        retention-days: 90
    - name: Verify all nine samples
      run: python3 "$RUNNER_TEMP/ios-worker-benchmark.py" summarize
    - name: Upload environment and measurements
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: sequential-worker-summary
        path: |-
          ${{ runner.temp }}/caro-worker-sequential/environment.json
          ${{ runner.temp }}/caro-worker-sequential/fingerprint.json
          ${{ runner.temp }}/caro-worker-sequential/measurements.json
        if-no-files-found: warn
        retention-days: 90
