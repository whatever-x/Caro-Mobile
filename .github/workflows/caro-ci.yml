name: Caro Mobile CI

on:
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    name: Spotless Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Spotless check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Slack Notify With Result
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success'
                && format('<{0}|#{1}> PR 린트 검사 결과 성공 ✅', github.event.pull_request.html_url, github.event.pull_request.number)
                || format('<{0}|#{1}> PR 린트 검사 결과 실패 🔥', github.event.pull_request.html_url, github.event.pull_request.number)
              }}"
            }