name: Caro Mobile CI

on:
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    name: Spotless Check
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Set Up
        uses: ./.github/actions/ci/set-up
        with:
          local_properties: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Spotless check
        run: ./gradlew spotlessCheck --stacktrace

  test-coverage:
    name: Kover Test Coverage Measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - uses: ./.github/actions/ci/set-up
        with:
          local_properties: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Run test
        run: ./gradlew test --build-cache --parallel

      - name: Generate Kover XML
        run: ./gradlew koverAllXmlReport --build-cache --parallel

      - name: Verify coverage
        run: ./gradlew koverAllVerify --build-cache --parallel

      - name: Collect Kover XML Report Paths
        id: report-paths
        if: always()
        run: |
          echo "paths<<EOF" >> $GITHUB_OUTPUT
          find . -path "*/build/reports/kover/report.xml" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment coverage on PR
        if: always()
        uses: mi-kas/kover-report@v1.9
        with:
          path: ${{ steps.report-paths.outputs.paths }}
          title: ViewModel / Repository Test Coverage
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          coverage-counter-type: LINE

  stability-check:
    name: Compose Stability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - uses: ./.github/actions/ci/set-up
        with:
          local_properties: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Append "sdk.dir" to local.properties
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> local.properties

      - name: Build Project
        run: ./gradlew :androidApp:assembleDebug --build-cache

      - name: Stability check
        run: ./gradlew stabilityCheck

  slack-notify:
    name: Slack Notify CI Result
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-check, test-coverage, stability-check]

    steps:
      - name: Build Slack message
        id: message
        shell: bash
        run: |
          reasons=()

          if [[ "${{ needs.lint-check.result }}" != "success" ]]; then
            reasons+=("Lint 실패")
          fi

          if [[ "${{ needs.test-coverage.result }}" != "success" ]]; then
            reasons+=("테스트 커버리지 미달성")
          fi

          if [[ "${{ needs.stability-check.result }}" != "success" ]]; then
            reasons+=("Composable 불안정")
          fi

          if [[ ${#reasons[@]} -eq 0 ]]; then
            message="<${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}> CI 통과 ✅"
          else
            joined_reasons=$(printf ", %s" "${reasons[@]}")
            joined_reasons=${joined_reasons:2}
            message="<${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}> CI 실패 ❌ (원인 : ${joined_reasons})"
          fi

          echo "text=${message}" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.message.outputs.text }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.message.outputs.text }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "PR #${{ github.event.pull_request.number }} 바로가기",
                        "emoji": true
                      },
                      "url": "${{ github.event.pull_request.html_url }}"
                    }
                  ]
                }
              ]
            }
