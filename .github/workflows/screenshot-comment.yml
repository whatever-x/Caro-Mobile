name: Screenshot Comment
run-name: 'Screenshot result · source ${{ github.event.workflow_run.id }} · attempt ${{ github.event.workflow_run.run_attempt }}'

on:
  workflow_run:
    workflows: [Screenshot PR]
    types: [completed]

permissions: {}

concurrency:
  group: screenshot-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  publish:
    name: PR image report
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      current: ${{ steps.comment-current-ios.outputs.current || steps.comment-current-android.outputs.current || steps.images.outputs.current || steps.current.outputs.current }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # All publisher code is inline in this trusted workflow revision.
      - uses: actions/download-artifact@v6
        with:
          name: screenshot-context
          path: build/screenshot-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate request identity
        id: context
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          metadata=build/screenshot-context/context.json
          [[ -f "$metadata" && ! -L "$metadata" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
          jq -e --argjson run "$SOURCE_RUN_ID" '
            .run_id == $run and (.pr_number | type == "number" and . > 0 and . == floor) and
            all(.head_sha, .base_sha, .merge_sha; type == "string" and test("^[a-f0-9]{40}$"))
          ' "$metadata" > /dev/null
          jq -r '{pr_number, head_sha, base_sha} | to_entries[] | "\(.key)=\(.value)"' "$metadata" >> "$GITHUB_OUTPUT"
      - name: Revalidate PR before publication
        if: github.event.workflow_run.conclusion == 'success'
        id: current
        run: |
          number=$(jq -r .pr_number build/screenshot-context/context.json)
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" |
            jq --slurpfile context build/screenshot-context/context.json --arg repo "$GITHUB_REPOSITORY" '
              $context[0] as $c |
              .number == $c.pr_number and .state == "open" and .base.ref == "develop" and
              .head.sha == $c.head_sha and .base.sha == $c.base_sha and .head.repo.full_name == $repo
            ')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" != true ]]; then echo "::notice::PR changed, closed or from a fork; publication skipped."; fi
      - uses: actions/download-artifact@v6
        if: steps.current.outputs.current == 'true'
        with:
          name: screenshot-before-after-android
          path: build/screenshot-publish/android
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        if: steps.current.outputs.current == 'true'
        with:
          name: screenshot-before-after-ios
          path: build/screenshot-publish/ios
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate report files and PR identity
        if: steps.current.outputs.current == 'true'
        id: report
        shell: bash
        run: |
          export LC_ALL=C
          merge=$(jq -r .merge_sha build/screenshot-context/context.json)
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/screenshot/scenarios.json?ref=$merge" --jq .content | base64 --decode > "$RUNNER_TEMP/screenshot-current-scenarios.json"
          [[ -d build/screenshot-publish && ! -L build/screenshot-publish ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
          test -z "$(find build/screenshot-publish ! -type d ! -type f -print)"
          : > "$RUNNER_TEMP/screenshot-publication-files"
          for platform in android ios; do
            if [[ "$platform" == android ]]; then profile=pixel10-pro; else profile=iphone18-pro; fi
            directory="build/screenshot-publish/$platform"
            summary="$directory/summary.json"
            [[ -d "$directory" && ! -L "$directory" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
            [[ -f "$summary" && ! -L "$summary" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
            jq -e --arg platform "$platform" --arg profile "$profile" \
              --slurpfile context build/screenshot-context/context.json --slurpfile registry "$RUNNER_TEMP/screenshot-current-scenarios.json" '
          def valid_registry:
            def safe: type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*\\z") and
              (contains("__") | not) and (test("_(actual|compare|before)\\z") | not);
            type == "object" and length > 0 and all(to_entries[];
              (.key | safe) and (.value | type == "array" and length > 0 and all(.[]; safe))) and
            ([.[][]] | length == (unique | length));
              def captures:
                [to_entries[] | .key as $module | .value[] as $id | ["ko", "en"][] as $language |
                  $module + "/" + $id + "__" + $language + "__" + $profile +
                  (if $id == "setting.notification.small.large-font" then "-small-large-font"
               elif (["library.preview.narrow", "library.preview.english.narrow", "library.preview.english.error"] | index($id)) != null then "-narrow"
               else "" end)] | sort;
              ($registry[0] | captures) as $expected | (.baseline_scenarios | captures) as $previous |
              .schema_version == 5 and .platform == $platform and
              .pr_number == $context[0].pr_number and .base_sha == $context[0].base_sha and
              .head_sha == $context[0].head_sha and .source_sha == $context[0].merge_sha and
              .languages == ["ko", "en"] and .profiles == {default: $profile, "small-large-font": ($profile + "-small-large-font"), narrow: ($profile + "-narrow")} and
              ($registry[0] | valid_registry) and (.baseline_scenarios | valid_registry) and .scenarios == $registry[0] and
              .total == ($expected | length) and all(.changed, .added, .removed; type == "array") and
              ((.changed + .added + .removed) | length == (unique | length)) and
              (.added | sort) == ($expected - $previous) and (.removed | sort) == ($previous - $expected) and
              all(.changed[]; . as $key | ($expected | index($key)) != null and ($previous | index($key)) != null)
            ' "$summary" > /dev/null
            jq -r '"summary.json", (.changed[] | . + "_before.png", . + "_actual.png"), (.added[] + "_actual.png")' \
              "$summary" | sort > "$RUNNER_TEMP/screenshot-platform-files"
            diff -u "$RUNNER_TEMP/screenshot-platform-files" <(find "$directory" -type f | sed "s|^$directory/||" | sort)
            while IFS= read -r file; do
              [[ -f "$directory/$file" && -s "$directory/$file" && ! -L "$directory/$file" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
              printf '%s/%s\n' "$platform" "$file" >> "$RUNNER_TEMP/screenshot-publication-files"
            done < "$RUNNER_TEMP/screenshot-platform-files"
          done
          diff -u <(sort "$RUNNER_TEMP/screenshot-publication-files") <(find build/screenshot-publish -type f | sed 's|^build/screenshot-publish/||' | sort)
          number=$(jq -r .pr_number build/screenshot-context/context.json)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if jq -es 'any(.[]; (.changed + .added | length) > 0)' build/screenshot-publish/{android,ios}/summary.json > /dev/null; then
            echo 'has-images=true' >> "$GITHUB_OUTPUT"
          else echo 'has-images=false' >> "$GITHUB_OUTPUT"; fi
      - name: Publish changed images to companion branch
        if: steps.current.outputs.current == 'true' && steps.report.outputs.has-images == 'true'
        id: images
        env:
          PR_NUMBER: ${{ steps.report.outputs.number }}
        run: |
          checkout=$(mktemp -d)
          git init --initial-branch screenshot-report "$checkout"
          git -C "$checkout" config user.name 'github-actions[bot]'
          git -C "$checkout" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$checkout" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          while IFS= read -r image; do
            relative="${image#build/screenshot-publish/}"
            mkdir -p "$checkout/$(dirname "$relative")"
            cp "$image" "$checkout/$relative"
          done < <(find build/screenshot-publish -type f -name '*.png' | sort)
          git -C "$checkout" add .
          git -C "$checkout" commit -m "chore: PR #$PR_NUMBER screenshot report"
          gh auth setup-git
          number=$(jq -r .pr_number build/screenshot-context/context.json)
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" |
            jq --slurpfile context build/screenshot-context/context.json --arg repo "$GITHUB_REPOSITORY" '
              $context[0] as $c |
              .number == $c.pr_number and .state == "open" and .base.ref == "develop" and
              .head.sha == $c.head_sha and .base.sha == $c.base_sha and .head.repo.full_name == $repo
            ')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" != true ]]; then echo "::notice::PR changed, closed or from a fork; publication skipped."; fi
          if [[ "$current" != true ]]; then exit 0; fi
          git -C "$checkout" push --force origin "HEAD:refs/heads/screenshots/pr-$PR_NUMBER"
          echo "sha=$(git -C "$checkout" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare platform comments
        if: steps.current.outputs.current == 'true' && steps.images.outputs.current != 'false'
        id: comments
        env:
          IMAGE_SHA: ${{ steps.images.outputs.sha }}
        run: |
          number=$(jq -r .pr_number build/screenshot-context/context.json)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100" > "$RUNNER_TEMP/screenshot-comments.json"
          for platform in android ios; do
            summary="build/screenshot-publish/$platform/summary.json"
            marker="<!-- caro-screenshot-report:$platform -->"
            matches=$(jq --arg marker "$marker" '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))]' "$RUNNER_TEMP/screenshot-comments.json")
            test "$(jq length <<< "$matches")" -le 1
            id=$(jq -r '.[0].id // empty' <<< "$matches")
            action=skip
            if [[ -n "$id" ]]; then action=update
            elif jq -e '(.changed + .added + .removed) | length > 0' "$summary" > /dev/null; then action=create; fi
            echo "$platform-comment-id=$id" >> "$GITHUB_OUTPUT"
            echo "$platform-action=$action" >> "$GITHUB_OUTPUT"
            jq -r --arg platform "$platform" --arg marker "$marker" --arg repo "$GITHUB_REPOSITORY" --arg sha "$IMAGE_SHA" '
              def capture_label: split("/")[1] | split("__") | "`\(.[0])` / `\(.[1])` / `\(.[2])`";
              def image($suffix): "https://raw.githubusercontent.com/\($repo)/\($sha)/\($platform)/\(.)\($suffix).png";
              $marker, ("### " + (if $platform == "android" then "Android 스크린샷" else "iOS 스크린샷" end)), "",
              "Golden: `develop` `\(.base_sha)` · 이미지 차이는 report-only입니다.", "",
              "| Scenario / language / profile | Result | Before | After |", "| --- | --- | --- | --- |",
              (.changed[] | "| \(capture_label) | 변경 | ![before](\(image("_before"))) | ![after](\(image("_actual"))) |"),
              (.added[] | "| \(capture_label) | 신규 · After | — | ![after](\(image("_actual"))) |"),
              (.removed[] | "| \(capture_label) | 시나리오 제거 | — | — |"),
              (if (.changed + .added + .removed | length) == 0 then "", "시각적 변경 없음" else empty end)
            ' "$summary" > "build/screenshot-comment-$platform.md"
          done
      - name: Revalidate PR before Android comment
        if: steps.current.outputs.current == 'true' && steps.images.outputs.current != 'false'
        id: comment-current-android
        run: |
          number=$(jq -r .pr_number build/screenshot-context/context.json)
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" |
            jq --slurpfile context build/screenshot-context/context.json --arg repo "$GITHUB_REPOSITORY" '
              $context[0] as $c |
              .number == $c.pr_number and .state == "open" and .base.ref == "develop" and
              .head.sha == $c.head_sha and .base.sha == $c.base_sha and .head.repo.full_name == $repo
            ')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" != true ]]; then echo "::notice::PR changed, closed or from a fork; publication skipped."; fi
      - name: Create or update Android screenshot comment
        if: steps.comment-current-android.outputs.current == 'true' && steps.comments.outputs.android-action != 'skip'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ steps.report.outputs.number }}
          comment-id: ${{ steps.comments.outputs.android-comment-id }}
          body-path: build/screenshot-comment-android.md
          edit-mode: replace
      - name: Revalidate PR before iOS comment
        if: steps.current.outputs.current == 'true' && steps.images.outputs.current != 'false'
        id: comment-current-ios
        run: |
          number=$(jq -r .pr_number build/screenshot-context/context.json)
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" |
            jq --slurpfile context build/screenshot-context/context.json --arg repo "$GITHUB_REPOSITORY" '
              $context[0] as $c |
              .number == $c.pr_number and .state == "open" and .base.ref == "develop" and
              .head.sha == $c.head_sha and .base.sha == $c.base_sha and .head.repo.full_name == $repo
            ')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" != true ]]; then echo "::notice::PR changed, closed or from a fork; publication skipped."; fi
      - name: Create or update iOS screenshot comment
        if: steps.comment-current-ios.outputs.current == 'true' && steps.comments.outputs.ios-action != 'skip'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ steps.report.outputs.number }}
          comment-id: ${{ steps.comments.outputs.ios-comment-id }}
          body-path: build/screenshot-comment-ios.md
          edit-mode: replace

  slack-notify:
    name: Slack Notify Screenshot Result
    needs: publish
    if: >-
      always() &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Build screenshot Slack message
        id: message
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          CURRENT: ${{ needs.publish.outputs.current }}
          COMPARE_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/screenshot-jobs.json"
          if [[ "$PUBLISH_RESULT" == success && ( "$COMPARE_RESULT" != success || "$CURRENT" == false ) ]]; then
            PUBLISH_RESULT=skipped
          fi
          jq -n --arg number "$PR_NUMBER" 'if $number == "" then [] else [{number: ($number | tonumber)}] end' > "$RUNNER_TEMP/screenshot-prs.json"
          jq --slurpfile event "$GITHUB_EVENT_PATH" \
            --slurpfile prs "$RUNNER_TEMP/screenshot-prs.json" \
            --arg publish "$PUBLISH_RESULT" \
            --arg publisher_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '
          def status_label:
            {success: "성공 ✅", failure: "실패 ❌", cancelled: "취소 ⏹️", skipped: "건너뜀 ⏭️",
             timed_out: "시간 초과 ❌", action_required: "조치 필요 ⚠️"}[. // "unknown"] // "결과 확인 필요 ⚠️";
          def escape: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");

          def message($run; $prs; $publish; $publisher_url):
          # Failed-job reruns retain the earlier successful platform; ignore later attempts.
          [.[].jobs[] | select(.run_attempt <= $run.run_attempt)] |
          group_by(.name) | map(max_by([.run_attempt, .id])) as $jobs |
          (if $run.conclusion != "success" then $run.conclusion
           elif $publish == "cancelled" then "cancelled"
           elif $publish == "skipped" then "skipped"
           elif $publish == "success" and
             all("android", "ios"; . as $platform |
               any($jobs[]; .name == "Compare / " + $platform and .conclusion == "success")) then "success"
           else "failure" end) as $result |
          ($prs[0] // null) as $pr |
          (if $pr then $pr.html_url // ($run.repository.html_url + "/pull/" + ($pr.number | tostring)) else null end) as $pr_url |
          (if $pr then "PR #\($pr.number)" else ($run.head_branch[0:80] | escape) end) as $identity |
          ($identity + " 스크린샷 CI " + ($result | status_label)) as $title |
          (["android", "ios" | . as $platform |
              ([$jobs[] | select(.name == "Compare / " + $platform)][0] // {}) as $job |
              {name: (if $platform == "android" then "Android" else "iOS" end), job: $job}
          ]) as $platforms |
          ([$platforms[] | "• *\(.name)*: \(.job.conclusion | status_label)"] +
           ["• *PR 이미지 리포트*: \($publish | status_label)"] | join("\n")) as $results |
          ([$platforms[] | select(.job.conclusion != "success" and .job.conclusion != "cancelled" and .job.conclusion != "skipped") |
            "*\(.name) — \(.job.conclusion | status_label)*\n" +
            ([.job.steps[]? | select(.conclusion == "failure" or .conclusion == "timed_out") | .name | escape] |
             if length > 0 then join("\n") else "실패 단계는 작업 로그에서 확인해 주세요." end)] +
           [$jobs[] | select(.name != "Compare / android" and .name != "Compare / ios" and .conclusion == "failure") |
            "*\(.name | escape) 실패*\n" + ([.steps[]? | select(.conclusion == "failure") | .name | escape] | join("\n"))] +
           [if $publish == "failure" then "*PR 이미지 리포트 게시 실패*" else empty end] | join("\n\n")) as $reasons |
          ([$platforms[] | select(.job.html_url) | "<\(.job.html_url)|\(.name) 로그>"] +
           ["<\($publisher_url)|리포트 게시 로그>", "<\($run.html_url)|전체 CI / 진단 아티팩트>"] | join(" · ")) as $links |
          (if $result == "success" then "*완료 내용*\nAndroid/iOS 테스트와 PR 이미지 리포트 게시 완료"
           elif $result == "skipped" then "*게시 생략*\nPR 변경·종료 또는 fork PR로 이미지 게시를 생략했습니다."
           elif $reasons != "" then "*실패 사유*\n" + $reasons
           else "*완료 상태*\n" + ($result | status_label) end) as $details |
          {title: $title, results: ("*플랫폼별 결과*\n" + $results), details: $details,
           links: ("*바로 확인*\n" + $links),
           button_text: (if $pr_url then $identity + " 바로가기 ↗" else "전체 CI 바로가기 ↗" end),
           button_url: ($pr_url // $run.html_url),
           fallback_text: ([$title, $results, $details, $links, $pr_url // empty] | join("\n"))};
          # Small self-check stays with the workflow logic.
          . as $pages |
          {conclusion: "success", run_attempt: 2, head_branch: "build/test", html_url: "https://github.com/example/repo/actions/runs/1",
           repository: {html_url: "https://github.com/example/repo"}, pull_requests: [{number: 999}]} as $sample |
          [{jobs: [
            {id: 1, run_attempt: 1, name: "Compare / android", conclusion: "success"},
            {id: 2, run_attempt: 1, name: "Compare / ios", conclusion: "failure"},
            {id: 3, run_attempt: 2, name: "Compare / ios", conclusion: "success"},
            {id: 4, run_attempt: 3, name: "Compare / ios", conclusion: "failure"}
          ]}] as $jobs |
          if ($jobs | message($sample; [{number: 123}]; "success"; "https://github.com/example/repo/actions/runs/2") |
                (.title | contains("성공")) and .button_url == "https://github.com/example/repo/pull/123") and
             ($jobs | message($sample; [{number: 123}]; "failure"; "https://github.com/example/repo/actions/runs/2") |
                (.title | contains("실패")) and (.details | contains("리포트 게시 실패"))) and
             ($jobs | message($sample; [{number: 123}]; "skipped"; "https://github.com/example/repo/actions/runs/2") |
                (.title | contains("건너뜀")) and (.details | contains("게시 생략"))) and
             ($jobs | message($sample + {pull_requests: []}; []; "cancelled"; "https://github.com/example/repo/actions/runs/2") |
                (.title | contains("취소")) and .button_text == "전체 CI 바로가기 ↗")
          then $pages | message($event[0].workflow_run; $prs[0]; $publish; $publisher_url)
          else error("Screenshot Slack message self-check failed") end
          ' "$RUNNER_TEMP/screenshot-jobs.json" > "$RUNNER_TEMP/screenshot-message.json"
          delimiter="slack-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          jq -r --arg delimiter "$delimiter" 'to_entries[] | "\(.key)<<\($delimiter)\n\(.value)\n\($delimiter)"' \
            "$RUNNER_TEMP/screenshot-message.json" >> "$GITHUB_OUTPUT"
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ${{ toJSON(steps.message.outputs.fallback_text) }}
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ${{ toJSON(steps.message.outputs.title) }}
                  emoji: true
              - type: divider
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(steps.message.outputs.results) }}
              - type: divider
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(steps.message.outputs.details) }}
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(steps.message.outputs.links) }}
              - type: actions
                elements:
                  - type: button
                    action_id: open_screenshot_pr
                    text:
                      type: plain_text
                      text: ${{ toJSON(steps.message.outputs.button_text) }}
                      emoji: true
                    style: primary
                    url: ${{ toJSON(steps.message.outputs.button_url) }}
              - type: divider
              - type: context
                elements:
                  - type: mrkdwn
                    text: "이미지 차이는 report-only이며 테스트 실패와 별개입니다."
