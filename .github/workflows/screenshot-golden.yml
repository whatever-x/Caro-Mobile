name: Screenshot Golden

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: screenshot-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Golden / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            target: androidHostTest
            task: recordRoborazziAndroidHostTest
            runner: ubuntu-24.04
          - platform: ios
            target: iosSimulatorArm64
            task: recordRoborazziIosSimulatorArm64
            runner: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Select Xcode 26.6
        if: matrix.platform == 'ios'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Configure offline screenshot fixtures
        run: |
          cat > local.properties <<'EOF'
          CARO_DEV_SERVER=https://example.invalid/
          CARO_QA_SERVER=https://example.invalid/
          CARO_PROD_SERVER=https://example.invalid/
          GOOGLE_WEB_CLIENT_ID=screenshot-test
          EOF
      - name: Record all scenarios
        run: ./gradlew '${{ matrix.task }}' --stacktrace
      - name: Validate and collect all 14 images
        run: python3 scripts/screenshot/collect.py '${{ matrix.target }}' build/screenshot-golden
      - uses: actions/upload-artifact@v6
        with:
          name: screenshot-golden-${{ matrix.platform }}
          path: build/screenshot-golden/
          if-no-files-found: error
          retention-days: 90
