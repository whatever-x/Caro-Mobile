name: Screenshot Golden

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: screenshot-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Golden / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            profile: pixel10-pro
            target: androidHostTest
            test-task: testAndroidHostTest
            task: recordRoborazziAndroidHostTest
            runner: ubuntu-24.04
          - platform: ios
            profile: iphone18-pro
            target: iosSimulatorArm64
            test-task: iosSimulatorArm64Test
            task: recordRoborazziIosSimulatorArm64
            runner: macos-26
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Select Xcode 26.6
        if: matrix.platform == 'ios'
        id: xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          dependency_hash=$(sed -E '/^version-(code|name)[[:space:]]*=/d' gradle/libs.versions.toml | shasum -a 256 | cut -d ' ' -f 1)
          echo "dependency_hash=$dependency_hash" >> "$GITHUB_OUTPUT"
      - name: Cache Kotlin/Native
        if: matrix.platform == 'ios'
        id: konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-v2-${{ matrix.runner }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.dependency_hash }}
      - name: Configure offline screenshot fixtures
        run: |
          cat > local.properties <<'EOF'
          CARO_DEV_SERVER=https://example.invalid/
          CARO_QA_SERVER=https://example.invalid/
          CARO_PROD_SERVER=https://example.invalid/
          GOOGLE_WEB_CLIENT_ID=screenshot-test
          EOF
      - name: Record all scenarios
        shell: bash
        run: |
          test_tasks=()
          while IFS= read -r module; do
            test_tasks+=(":feature:$module:${{ matrix.test-task }}" --rerun)
          done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
          ./gradlew '${{ matrix.task }}' "${test_tasks[@]}" --stacktrace --profile --console=plain
      - name: Validate and collect multilingual Golden
        shell: bash
        run: |
          export LC_ALL=C
          jq -e '
          def valid_registry:
            def safe: type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*\\z") and
              (contains("__") | not) and (test("_(actual|compare|before)\\z") | not);
            type == "object" and length > 0 and all(to_entries[];
              (.key | safe) and (.value | type == "array" and length > 0 and all(.[]; safe))) and
            ([.[][]] | length == (unique | length));
            valid_registry' scripts/screenshot/scenarios.json > /dev/null
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid Golden source SHA." >&2; exit 1; }
          [[ ! -e build/screenshot-golden && ! -L build/screenshot-golden ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
          mkdir -p build/screenshot-golden
          while IFS= read -r module; do
            capture_source="feature/$module/build/outputs/roborazzi/$TARGET"
            [[ -d "$capture_source" && ! -L "$capture_source" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
            test -z "$(find "$capture_source" ! -type d ! -type f -print)"
            jq -r --arg module "$module" --arg profile "$PROFILE" '
              .[$module][] as $id | ["ko", "en"][] as $language |
              $id + "__" + $language + "__" + $profile +
              (if $id == "setting.notification.small.large-font" then "-small-large-font"
               elif (["library.preview.narrow", "library.preview.english.narrow", "library.preview.english.error"] | index($id)) != null then "-narrow"
               else "" end) + ".png"
            ' scripts/screenshot/scenarios.json | sort > "$RUNNER_TEMP/screenshot-module-files"
            diff -u "$RUNNER_TEMP/screenshot-module-files" <(find "$capture_source" -type f | sed "s|^$capture_source/||" | sort)
            mkdir -p "build/screenshot-golden/$module"
            while IFS= read -r image; do
              [[ -f "$capture_source/$image" && -s "$capture_source/$image" && ! -L "$capture_source/$image" ]] || { echo "::error::Required screenshot input/output path condition failed." >&2; exit 1; }
              cp "$capture_source/$image" "build/screenshot-golden/$module/"
            done < "$RUNNER_TEMP/screenshot-module-files"
          done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
          jq -n --arg platform "$PLATFORM" --arg source "$GITHUB_SHA" --arg profile "$PROFILE" \
            --slurpfile scenarios scripts/screenshot/scenarios.json '
            {schema_version: 5, platform: $platform, source_sha: $source, languages: ["ko", "en"],
             profiles: {default: $profile, "small-large-font": ($profile + "-small-large-font"), narrow: ($profile + "-narrow")}, scenarios: $scenarios[0]}
          ' > build/screenshot-golden/metadata.json
      - uses: actions/upload-artifact@v6
        with:
          name: screenshot-golden-${{ matrix.platform }}
          path: build/screenshot-golden/
          if-no-files-found: error
          retention-days: 90
      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-profile-${{ matrix.platform }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14
