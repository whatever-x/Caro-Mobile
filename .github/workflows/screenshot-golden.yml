name: Screenshot Golden

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: screenshot-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Golden / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            target: androidHostTest
            task: recordRoborazziAndroidHostTest
            runner: ubuntu-24.04
          - platform: ios
            target: iosSimulatorArm64
            task: recordRoborazziIosSimulatorArm64
            runner: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Select Xcode 26.6
        if: matrix.platform == 'ios'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Configure offline screenshot fixtures
        run: |
          cat > local.properties <<'EOF'
          CARO_DEV_SERVER=https://example.invalid/
          CARO_QA_SERVER=https://example.invalid/
          CARO_PROD_SERVER=https://example.invalid/
          GOOGLE_WEB_CLIENT_ID=screenshot-test
          EOF
      - name: Record all scenarios
        run: ./gradlew '${{ matrix.task }}' --stacktrace --rerun-tasks
      - name: 등록된 스크린샷 검증 및 수집
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          jq -e 'type == "object" and length > 0 and all(to_entries[];
            (.key | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.value | type == "array" and length > 0 and length == (unique | length) and
              all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and
                (test("_(actual|compare)$") | not))))' scripts/screenshot/scenarios.json > /dev/null
          mkdir -p build/screenshot-golden
          while IFS= read -r module; do
            source="feature/$module/build/outputs/roborazzi/$TARGET"
            test -d "$source"
            diff -u <(jq -r --arg module "$module" '.[$module][] + ".png"' scripts/screenshot/scenarios.json | sort) \
              <(find "$source" -type f -name '*.png' -exec basename {} \; | sort)
            mkdir -p "build/screenshot-golden/$module"
            while IFS= read -r scenario; do
              test -f "$source/$scenario.png" && test ! -L "$source/$scenario.png"
              cp "$source/$scenario.png" "build/screenshot-golden/$module/"
            done < <(jq -r --arg module "$module" '.[$module][]' scripts/screenshot/scenarios.json)
          done < <(jq -r 'keys[]' scripts/screenshot/scenarios.json)
          cp scripts/screenshot/scenarios.json build/screenshot-golden/
      - uses: actions/upload-artifact@v6
        with:
          name: screenshot-golden-${{ matrix.platform }}
          path: build/screenshot-golden/
          if-no-files-found: error
          retention-days: 90
