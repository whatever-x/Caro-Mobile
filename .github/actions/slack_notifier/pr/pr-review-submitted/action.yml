name: Slack - PR Review Submitted

inputs:
  slack_webhook_url:
    required: true
  review_header:
    required: true

runs:
  using: "composite"
  steps:
    - name: Extract PR review info
      id: pr-review-info
      shell: bash
      run: |
        PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
        PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
        PR_URL=$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")
        REVIEWER=$(jq -r '.review.user.login' "$GITHUB_EVENT_PATH")
        REVIEWER_URL="https://github.com/${REVIEWER}"
        REVIEWER_AVATAR=$(jq -r '.review.user.avatar_url' "$GITHUB_EVENT_PATH")
        REVIEW_BODY=$(jq -r '.review.body' "$GITHUB_EVENT_PATH")

        HAS_REVIEW_BODY=true
        if [ -z "$REVIEW_BODY" ] || [ "$REVIEW_BODY" = "null" ]; then
          HAS_REVIEW_BODY=false
        fi

        echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
        echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
        echo "reviewer=$REVIEWER" >> "$GITHUB_OUTPUT"
        echo "reviewer_url=$REVIEWER_URL" >> "$GITHUB_OUTPUT"
        echo "reviewer_avatar=$REVIEWER_AVATAR" >> "$GITHUB_OUTPUT"
        echo "has_review_body=$HAS_REVIEW_BODY" >> "$GITHUB_OUTPUT"

        if [ "$HAS_REVIEW_BODY" = "true" ]; then
          {
            echo "review_body<<EOF"
            printf "%s" "$REVIEW_BODY" | tr -d '\r'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Build Slack payload JSON
      if: ${{ steps.pr-review-info.outputs.has_review_body == 'true' }}
      id: build-payload
      shell: bash
      run: |
        PAYLOAD_PATH="${RUNNER_TEMP}/slack-payload.json"

        jq -n \
          --arg header "${{ inputs.review_header }}" \
          --arg pr_title "${{ steps.pr-review-info.outputs.pr_title }}" \
          --arg pr_url "${{ steps.pr-review-info.outputs.pr_url }}" \
          --arg pr_number "${{ steps.pr-review-info.outputs.pr_number }}" \
          --arg reviewer "${{ steps.pr-review-info.outputs.reviewer }}" \
          --arg reviewer_url "${{ steps.pr-review-info.outputs.reviewer_url }}" \
          --arg reviewer_avatar "${{ steps.pr-review-info.outputs.reviewer_avatar }}" \
          --arg review_body "${{ steps.pr-review-info.outputs.review_body }}" \
          '{
            blocks: [
              {
                type: "header",
                text: { type: "plain_text", text: $header, emoji: true }
              },
              {
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: ("- *<" + $pr_url + "|" + $pr_title + ">* #" + $pr_number + "\n" +
                         "- *<" + $reviewer_url + "|" + $reviewer + ">* 님의 리뷰 코멘트\n\n" +
                         $review_body)
                },
                accessory: {
                  type: "image",
                  image_url: $reviewer_avatar,
                  alt_text: ("by " + $reviewer)
                }
              }
            ]
          }' > "$PAYLOAD_PATH"

        echo "payload_path=$PAYLOAD_PATH" >> "$GITHUB_OUTPUT"

    - name: Send Slack Notification
      if: ${{ steps.pr-review-info.outputs.has_review_body == 'true' }}
      uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ inputs.slack_webhook_url }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ steps.build-payload.outputs.payload_path }}
