name: Slack - PR Line Commented

inputs:
  slack_webhook_url:
    required: true

runs:
  using: "composite"
  steps:
    - name: Extract PR line comment info
      id: pr-line-comment
      shell: bash
      run: |
        PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
        PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
        PR_URL=$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")

        COMMENT_BODY=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
        COMMENT_AUTHOR=$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")
        COMMENT_AUTHOR_URL="https://github.com/${COMMENT_AUTHOR}"

        HAS_COMMENT_BODY=true
        if [ -z "$COMMENT_BODY" ] || [ "$COMMENT_BODY" = "null" ]; then
          HAS_COMMENT_BODY=false
        fi

        echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
        echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
        echo "comment_author=$COMMENT_AUTHOR" >> "$GITHUB_OUTPUT"
        echo "comment_author_url=$COMMENT_AUTHOR_URL" >> "$GITHUB_OUTPUT"
        echo "has_comment_body=$HAS_COMMENT_BODY" >> "$GITHUB_OUTPUT"

        if [ "$HAS_COMMENT_BODY" = "true" ]; then
          {
            echo "comment_body<<EOF"
            printf "%s" "$COMMENT_BODY" | tr -d '\r'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Build Slack payload JSON
      id: build-payload
      shell: bash
      run: |
        PAYLOAD_PATH="${RUNNER_TEMP}/slack-line-comment-payload.json"

        jq -n \
          --arg pr_title "${{ steps.pr-line-comment.outputs.pr_title }}" \
          --arg pr_url "${{ steps.pr-line-comment.outputs.pr_url }}" \
          --arg pr_number "${{ steps.pr-line-comment.outputs.pr_number }}" \
          --arg author "${{ steps.pr-line-comment.outputs.comment_author }}" \
          --arg author_url "${{ steps.pr-line-comment.outputs.comment_author_url }}" \
          --arg body "${{ steps.pr-line-comment.outputs.comment_body }}" \
          '{
            blocks: [
              {
                type: "section",
                text: {
                  type: "mrkdwn",
                  text:
                    ("💬 PR 라인 코멘트\n" +
                     "- *<" + $pr_url + "|" + $pr_title + ">* #" + $pr_number + "\n\n" +
                     $body)
                }
              },
              {
                type: "context",
                elements: [
                  { type: "mrkdwn", text: ("by <" + $author_url + "|" + $author + ">") }
                ]
              }
            ]
          }' > "$PAYLOAD_PATH"

        echo "payload_path=$PAYLOAD_PATH" >> "$GITHUB_OUTPUT"

    - name: Send Slack Notification
      if: ${{ steps.pr-line-comment.outputs.has_comment_body == 'true' }}
      uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ inputs.slack_webhook_url }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ steps.build-payload.outputs.payload_path }}
