name: Slack - Branch Deleted

inputs:
  slack_webhook_url:
    required: true

runs:
  using: "composite"
  steps:
    - name: Extract branch deleted info
      id: branch-info
      shell: bash
      run: |
        BRANCH_NAME=$(jq -r '.ref' "$GITHUB_EVENT_PATH")
        ACTOR="${{ github.actor }}"
        ACTOR_URL="https://github.com/${ACTOR}"
        BRANCH_MESSAGE="🗑️ \`${BRANCH_NAME}\` 브랜치가 삭제되었습니다."
        
        echo "branch_message=${BRANCH_MESSAGE}" >> $GITHUB_OUTPUT
        echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
        echo "actor_url=${ACTOR_URL}" >> $GITHUB_OUTPUT

    - name: Send Slack Notification
      uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ inputs.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          blocks:
            - type: "section"
              text:
                type: "mrkdwn"
                text: ${{ toJSON(steps.branch-info.outputs.branch_message) }}
            - type: "context"
              elements:
                - type: "mrkdwn"
                  text: "by <${{ steps.branch-info.outputs.actor_url }}|${{ steps.branch-info.outputs.actor }}>"
