name: CI Set Up
description: Set up local.properties, Android secrets, JDK 17, and Gradle for CI.

inputs:
  local_properties:
    description: Extra properties to append to local.properties.
    required: false
    default: ""
  google_services_json:
    description: Base64-encoded androidApp/google-services.json content.
    required: true
  keystore_base64:
    description: Base64-encoded Android signing keystore.
    required: true

runs:
  using: composite
  steps:
    - name: Generate local.properties (no sdk.dir)
      shell: bash
      env:
        LOCAL_PROPERTIES: ${{ inputs.local_properties }}
      run: |
        rm -f local.properties
        touch local.properties
        if [ -n "$LOCAL_PROPERTIES" ]; then
          printf "%s\n" "$LOCAL_PROPERTIES" >> local.properties
        fi

    - name: Decode google-services.json
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ inputs.google_services_json }}
      run: |
        printf "%s" "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

    - name: Decode Keystore
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
      run: |
        printf "%s" "$KEYSTORE_BASE64" | base64 --decode > caro_key_store.jks

    - name: Set Up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    - name: Set Up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true
