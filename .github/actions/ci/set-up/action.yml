name: CI Set Up

inputs:
  local_properties:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Generate local.properties (no sdk.dir)
      shell: bash
      run: |
        rm -f local.properties
        touch local.properties
        if [ -n "${{ inputs.local_properties }}" ]; then
          printf "%s\n" "${{ inputs.local_properties }}" >> local.properties
        fi

    - name: Set Up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    - name: Set Up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true
